name: release

# Builds and ships Typst Studio for macOS (aarch64 + x86_64), Linux, and Windows.
# Triggered by version tags (v*) or manually via the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag (vX.Y.Z)'
        required: true
        type: string

# tauri-action creates the draft release via the API — the default read-only
# GITHUB_TOKEN cannot, so contents:write is required.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    env:
      # The frontend bundles a ~10MB Monaco chunk; Vite's chunk-rendering phase
      # exceeds Node's default (~2GB) heap on macOS runners and OOMs.
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # With the committed lockfile, cache node_modules itself keyed on
      # package-lock.json — a warm `npm install` then just verifies the tree
      # (a few seconds) instead of resolving + extracting ~1GB of packages.
      # node_modules/.cache/grammar (the tinymist VSIX download cache) is
      # subsumed by this entry.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin x86_64-apple-darwin' || '' }}

      # Cache the cargo registry + compiled dependencies (keyed on
      # Cargo.lock, segmented per matrix job — the two macOS targets get
      # separate target-dir caches). Dependency compilation is the bulk of
      # each job; this cuts warm builds from ~15-20 min to a few minutes.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On a tag push, github.ref_name is the tag (vX.Y.Z). On a manual
          # workflow_dispatch run it is the BRANCH name (e.g. "master"), which
          # would make tauri-action create a stray tag/release named after the
          # branch — so prefer the required `tag` input on manual runs.
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Typst Studio ${{ inputs.tag || github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
