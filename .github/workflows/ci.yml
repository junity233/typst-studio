name: ci

# PR/push 测试门禁：前端 typecheck + vitest、Rust clippy + cargo test。
# 发布构建仍由 release.yml（tag 触发）负责。
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Agent 门禁：note 格式 + AGENTS.md 词数预算（与 pre-commit 同源，
  # 纯 stdlib，无需 Node）。--format-adopted 固定为体系启用日。
  agent-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent-note format gate
        run: python3 scripts/check_agent_repo.py notes --format-adopted 2026-08-15
      - name: AGENTS.md word-budget gate
        run: python3 scripts/check_agent_repo.py budget

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # tsc 会 import 生成的 grammar manifest（src/assets/grammar/*.json 被
      # .gitignore 忽略、由该脚本生成），类型检查前必须先拉取。
      - name: Fetch Typst grammar
        run: npm run fetch-grammar
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests
        run: npm run test:run
      # 每个 PR 证明前端仍可打包（release.yml 只在 tag 时构建）。
      - name: Build
        run: npm run build

  rust:
    strategy:
      # 本仓库是 win32 优先的桌面应用（windows-sys FFI、comctl32 DELAYLOAD、
      # dunce 路径处理、trash 回收站），Linux 单独跑不住平台特定回归 —— 双平台
      # 都必须绿。fail-fast 关掉：一个平台先红不应掩盖另一个平台的结果。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Linux 需要 GTK/WebKit 头文件才能编译 tauri；Windows 官方 runner 自带全部所需。
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 每个平台独立缓存（key 自动含 runner os，这里显式声明避免歧义）。
          prefix-key: rust-${{ matrix.os }}
      # 不用 -D warnings：src/git/status.rs 仍有 1 个已知警告（见 round 计划），
      # 严格化留待该警告清除后。
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets
      - name: Tests
        working-directory: src-tauri
        run: cargo test
      # ts-rs 漂移门禁：带 export-types 特性重新生成 src/lib/types.ts，任何
      # 未提交的差异都说明 Rust wire 类型改了但前端类型没再生 —— 让序列化漂移
      # 在 CI 就失败，而不是等线上暴露。（在 Linux 上跑一次即可，类型生成与
      # 目标平台无关。）
      - name: ts-rs type drift gate
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          cargo test --lib --features export-types export_types
          git diff --exit-code -- ../src/lib/types.ts \
            || (echo "::error::src/lib/types.ts is stale — run 'cargo test --features export-types' in src-tauri and commit the regenerated file" && exit 1)
