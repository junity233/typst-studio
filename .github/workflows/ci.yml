name: ci

# PR/push 测试门禁：前端 typecheck + vitest、Rust clippy + cargo test。
# 发布构建仍由 release.yml（tag 触发）负责。
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Agent 门禁：note 格式 + AGENTS.md 词数预算（与 pre-commit 同源，
  # 纯 stdlib，无需 Node）。--format-adopted 固定为体系启用日。
  agent-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent-note format gate
        run: python3 scripts/check_agent_repo.py notes --format-adopted 2026-08-15
      - name: AGENTS.md word-budget gate
        run: python3 scripts/check_agent_repo.py budget

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # tsc 会 import 生成的 grammar manifest（src/assets/grammar/*.json 被
      # .gitignore 忽略、由该脚本生成），类型检查前必须先拉取。
      - name: Fetch Typst grammar
        run: npm run fetch-grammar
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests
        run: npm run test:run
      # 每个 PR 证明前端仍可打包（release.yml 只在 tag 时构建）。
      - name: Build
        run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 与 release.yml 相同的系统依赖：tauri 在 Linux 上编译需要 GTK/WebKit 头文件。
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # 不用 -D warnings：src/git/status.rs 仍有 1 个已知警告（见 round 计划），
      # 严格化留待该警告清除后。
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets
      - name: Tests
        working-directory: src-tauri
        run: cargo test
